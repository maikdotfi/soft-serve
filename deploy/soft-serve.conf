# Environment overrides for the soft-serve systemd service.
#
# Anything set here overrides values in $SOFT_SERVE_DATA_PATH/config.yaml.
# Keys in SOFT_SERVE_INITIAL_ADMIN_KEYS are merged with initial_admin_keys
# from config.yaml.
#
#SOFT_SERVE_GIT_LISTEN_ADDR=:9418
#SOFT_SERVE_HTTP_LISTEN_ADDR=:23232
#SOFT_SERVE_SSH_LISTEN_ADDR=:23231
#SOFT_SERVE_SSH_KEY_PATH=ssh/soft_serve_host_ed25519
#SOFT_SERVE_INITIAL_ADMIN_KEYS='ssh-ed25519 AAAAC3NzaC1lZDI1...'
#
# Automatic Let's Encrypt certificates (see docs/fork/ACME.md). Needs the
# hostname's DNS pointing here, port 443 reachable, and
# AmbientCapabilities=CAP_NET_BIND_SERVICE in soft-serve.service.
#SOFT_SERVE_HTTP_LISTEN_ADDR=:443
#SOFT_SERVE_HTTP_PUBLIC_URL=https://git.example.com
#SOFT_SERVE_HTTP_ACME_ENABLED=true
#SOFT_SERVE_HTTP_ACME_DOMAINS=git.example.com
#SOFT_SERVE_HTTP_ACME_EMAIL=you@example.com
